name: keepalive

# Supabase's free plan pauses a project after ~7 days with no activity, which
# takes the whole app down (events, votes, admin login). This hits an endpoint
# that queries the database so the project always counts as active.
on:
  schedule:
    - cron: '17 12 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend (touches Supabase)
        run: |
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' --max-time 60 "https://recuerdos-en-vivo.netlify.app/api/votes?folder=keepalive")
          echo "HTTP $code"; cat /tmp/out.json; echo
          test "$code" = "200"
